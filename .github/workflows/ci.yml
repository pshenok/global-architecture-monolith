name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, typecheck, test, build, template, e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://gam:gam@localhost:5432/gam_test
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "26"

      - name: Install pnpm (the repo pins Node and pnpm via devEngines)
        run: npm install --global pnpm@12.16.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:setup

      - name: Lint (Biome, check-access, check-boundaries, oxlint)
        run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm template:verify

      - name: End to end (PM2 stack)
        run: |
          pnpm stack:up
          pnpm test:e2e
      - name: Stack logs on failure
        if: failure()
        run: tail -n 100 ~/.pm2/logs/*.log || true
