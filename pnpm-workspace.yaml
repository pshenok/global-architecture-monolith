packages:
  - apps/*
  - modules/*
  - packages/*
  # Compiled and tested like a module, but never mounted: pnpm new:module copies it.
  - templates/*

# ---- supply chain (pnpm 12) -------------------------------------------------
# New versions become installable only after 24h; transitive deps may not come
# from git/tarball URLs; unknown install scripts fail the install.
minimumReleaseAge: 1440
blockExoticSubdeps: true
strictDepBuilds: true
engineStrict: true

# The ONLY packages allowed to run install scripts.
allowBuilds:
  "@swc/core": true
  esbuild: true
  protobufjs: false # postinstall only prints a warning (pulled in by the OTLP exporters)
  "@scarf/scarf": false # install telemetry pulled in by swagger-ui-dist

# ---- dependency catalog: every version lives here ---------------------------
catalogMode: strict
savePrefix: ""

catalog:
  # framework
  "@nestjs/common": 12.2.0
  "@nestjs/core": 12.2.0
  "@nestjs/platform-fastify": 12.2.0
  "@nestjs/swagger": 12.0.2
  "@nestjs/testing": 12.2.0
  "@nestjs/throttler": 6.7.1
  fastify: 5.12.7
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  # data
  drizzle-orm: 1.0.0-rc.5
  drizzle-kit: 1.0.0-rc.5
  pg: 8.23.1
  "@types/pg": 8.23.1
  uuid: 14.0.3
  nestjs-cls: 7.0.1
  "@nestjs-cls/transactional": 4.0.1
  "@nestjs-cls/transactional-adapter-drizzle-orm": 2.0.1
  # auth (JWS verification of identity-provider access tokens)
  jose: 6.2.13
  # validation, logging
  zod: 4.6.7
  pino: 10.4.0
  pino-http: 11.0.0
  nestjs-pino: 5.3.1
  pino-pretty: 13.2.0
  "@scalar/nestjs-api-reference": 1.2.30
  # observability (loaded only when OTEL_EXPORTER_OTLP_ENDPOINT is set)
  "@opentelemetry/api": 1.10.0
  "@opentelemetry/sdk-node": 0.300.0
  "@opentelemetry/instrumentation-http": 0.300.0
  "@opentelemetry/instrumentation-pg": 0.77.0
  "@opentelemetry/instrumentation-pino": 0.70.0
  "@fastify/otel": 0.21.3
  import-in-the-middle: 3.5.2
  # tooling
  "@biomejs/biome": 2.6.2
  oxlint: 1.89.0
  oxlint-tsgolint: 7.0.2004
  turbo: 2.11.10
  typescript: 7.0.2
  "@swc/core": 1.16.18
  "@swc/cli": 0.8.1
  chokidar: 5.0.0
  unplugin-swc: 2.0.0
  vitest: 5.0.5
  vite: 8.3.5
  pm2: 7.1.0
  undici: 8.12.3
  "@types/node": 26.6.5

peerDependencyRules:
  allowedVersions:
    # @fastify/otel 0.21.x still depends on OTel core 2.x, whose peer range stops below api 1.10
    "@opentelemetry/core@2>@opentelemetry/api": "1.10"
    # optional peer used only by the Swagger CLI plugin (needs the TS 6 API); we generate OpenAPI from Zod
    "@nestjs/swagger>typescript": "7"
